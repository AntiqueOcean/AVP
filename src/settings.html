 <!DOCTYPE html>
<html lang="en" class="theme-dark font-size-medium base-theme-essential">
<head>
    <meta charset="UTF-8" />
    <title>Settings</title>
    <script type="text/javascript" src="config.json"></script>
    <link rel="stylesheet" href="index.css">
    <script src="Scripts/prefixfree.min.js" ></script>
    <script src="Scripts/settings.js" defer></script>

</head>
<body>
    <section class="settings">
        <div id="settingsTitlebar" class="title-bar">Settings</div>
        <div class="window">
            <div class="upper">
                <div class="left">
                    <button>Appearance</button>
                    <button>Video</button>
                    <button>Audio</button>
                    <button>Subtitle</button>
                    <button onclick="setSettingsContent('input');">Input</button>
                    <button>Cache</button>
                    <button>Proxy</button>
                    <hr style="width: 100%; border-color: var(--toolbar-background-color); margin: 0; margin-top: auto;"/>
                    <button onclick="alert('info');">about</button>
                </div>
                <div class="right">
                    <div id="settingsContent"  class="content">

                    </div>
                </div>
            </div>
            <div class="lower">
                <button onclick="window.close()">close</button>
                <button onclick="window.close()">apply</button>
            </div>
        </div>
    </section>
</body>
</html>
