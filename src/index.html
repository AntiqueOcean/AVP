<!DOCTYPE html>
<html class="theme-dark font-size-medium base-theme-essential">
  <head>
    <meta charset="UTF-8" />
    <title>Lump</title>
    <script type="text/javascript" src="config.json"></script>
    <link rel="stylesheet" href="index.css">
    <script src="Scripts/prefixfree.min.js" ></script>
    <!-- <script src="index.js"></script> -->
    <script src="Scripts/video-js.js"></script>
    <script src="Scripts/main.js" type="module" defer></script>


  </head>
  <body>
    <section class="main-win" id="mainWin" ondrop="loadVideoFromDrop(event, this);">

      <div id="topBar" class="top-bar">
        <div class="upper">

          <div class="app-title" onclick="addTempMenu(event, 'list-menu', 'info_menu', info_items)">
            <div class="left">legit ultimate</div>
            <div class="right">Media Player</div>
            <div class="drop-down-button"></div>
          </div>

          <div class="title-bar">
            <input type="checkbox" class="edit-button" id="editCheck"/>
            <label for="editCheck"></label>
            <iframe name="dummyframe" id="dummyframe" style="display: none;"></iframe>
            <form target="dummyframe" onsubmit="loadVideoFromInput();">
              <input id="fnameTitle" spellcheck="false" readonly></input>
              <input type="text" spellcheck="false" id="fname" name="fname" value="default_file_name.type">
              <input type="button" onsubmit="loadVideoFromPath();" value="file ↓"/>
              <input type="submit" value="go ↩"/>
            </form>
          </div>
        
          <div class="top-bar-buttons">
            <button id="mainCloseButton" style="--image: url(svg/exit.svg); --color: var(--alt-color-red, red)"/>
            <button id="maximizeButton" style="--image: url(svg/maximize.svg); --color: var(--toolbar-text-color, white)"/>
            <button id="minimizeButton" style="--image: url(svg/minimize.svg); --color: var(--toolbar-text-color, white)"/>
          </div>
      
      </div>

      <div class="lower">
        <button class="tab unselected" >file0</button>
        <button class="tab unselected" >file1</button>
        <button class="tab selected" >file2</button>
        <button class="tab unselected" >file3</button>
      </div>
      </div>
      <!-- end of top bar-->

      <div class="main-player" id="mainPlayer">
        <div class="notifications" id="notifications">
        </div>
        <!--
        <iframe src="https://www.youtube.com/embed/88sARuFu-tc?modestbranding=1&autoplay=0&autohide=1&showinfo=0&controls=0" frameborder="0">
        </iframe>
      -->

        <video
        id="video"
        class="video-js"
        preload="auto"
        fluid="true"
        data-setup="{'html5': {
          nativeTextTracks: true
      }}"
        src=""
      >
      </video>

        <!--
        <div id="donationPopUp" class="donation">
          <h1>support me!</h1>
          <span>since there is quite literaly no way for me to make money out of my programming skills (iran's sanctions), your donations, even a small amount will help a lot.</span>
          <button style="--color: var(--alt-color-green)">i'll help</button>
          <button style="--color: var(--alt-color-red)" onclick="document.getElementById('donationPopUp').remove();">close</button>
        </div>
      -->
      </div>

      <div id="bottomBar" class="bottom-bar" >
        <div class="timer-bar">
          <iframe name="dummyframe" id="dummyframe" style="display: none;"></iframe>
          <form id="timeInputForm" target="dummyframe">
            <input class="left" type="text" pattern="[0-9\:]*$" id="timeInput" name="timeInput" value="00:00:00"/>
            <input type="button" value="" hidden/>
          </form>
          <div class="middle" id="timerBarMiddle">
            <div class="bar" id="timerBarMiddleBar"></div>
            <div class="stamp" id="timeStamp">00:00:00</div>
          </div>
          <div class="right" id="timerBarRight">00:00:00</div>

        </div>
        <div class="rest">

          <div class="left">
            <button id="previousButton" style="--image: url(svg/subtitle.svg);"></button>
            <button id="themesButton" style="--image: url(svg/mode.svg);"></button>
            <button id="previousButton" style="--image: url(svg/previous.svg);"></button>
          </div>

          <div class="middle">
            <button id="previousButton" tabindex="-1" style="--image: url(svg/previous.svg); width: calc(var(--font-tiny) * 2.1); height: calc(var(--font-tiny) * 1.8);"></button>
            <button id="backwardButton" tabindex="-1" style="--image: url(svg/backward.svg); width: calc(var(--font-tiny) * 2.7); height: calc(var(--font-tiny) * 1.8);"></button>
            <button id="playButton" tabindex="-1" style="--image: url(svg/play.svg); width: calc(var(--font-tiny) * 2.6); height: calc(var(--font-tiny) * 2.6);"></button>
            <button id="forwardButton" tabindex="-1" style="--image: url(svg/forward.svg); width: calc(var(--font-tiny) * 2.7); height: calc(var(--font-tiny) * 1.8);">
            <!-- <div class="list-menu">
              <div style="--tag:'  '" onclick="">2x</div>
            </div> -->
            </button>
            <button id="nextButton" style="--image: url(svg/next.svg); width: calc(var(--font-tiny) * 2.1); height: calc(var(--font-tiny) * 1.8);"></button>
          </div>

          <div class="right">

            <div class="audio-section" id="volumeController">
              <button id="muteButton" style="--image: url(svg/audioOn.svg)"></button>
              <div id="volumeBarBg" class="audio-control">
                <div id="volumeBar" class="bar"></div>
              </div>
              <iframe name="dummyframe" id="dummyframe" style="display: none;"></iframe>
                <form id="volumeNumberInputForm" target="dummyframe">
                  <input name="volumeNumberInput" type="number" maxlength="3" max="100" id="volumeNumberInput" value="20"
                  oninput="javascript:
                  if (this.value.length > 2 && value != 100) this.value = this.value.slice(0, 2);
                  ">
                  <input type="submit" hidden/>
                </form>
              
            </div>
          </div>
        </div>
      </div>
      <div id="currentTempMenu">

      </div>
    </section>
  </body>
</html>
